<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات الملك الأسطوري</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a24; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية (الأقسام) */
        .sidebar { width: 260px; background-color: #111118; display: flex; flex-direction: column; border-left: 2px solid #ffd700; }
        .sidebar-header { padding: 20px; text-align: center; font-size: 20px; font-weight: bold; color: #ffd700; border-bottom: 1px solid #222; }
        .rooms-list { flex: 1; overflow-y: auto; padding: 10px; }
        .room-btn { width: 100%; padding: 12px; background: none; border: none; color: #ccc; text-align: right; font-size: 16px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; }
        .room-btn:hover, .room-btn.active { background-color: #ffd700; color: #000; font-weight: bold; }

        /* منطقة الشات الرئيسية */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #1e1e2a; }
        .chat-header { padding: 15px; background-color: #151520; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3f; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* تصميم الرسائل والرتب */
        .message { background-color: #252538; padding: 10px 15px; border-radius: 12px; max-width: 75%; width: fit-content; border-right: 4px solid #00bcff; }
        .msg-meta { display: flex; gap: 10px; font-size: 12px; margin-bottom: 4px; }
        .username { font-weight: bold; color: #00bcff; }
        .rank-imperial { color: #ffd700; font-weight: bold; background: rgba(255, 215, 0, 0.1); padding: 1px 6px; border-radius: 4px; border: 1px solid #ffd700; }
        .msg-text { font-size: 15px; word-break: break-word; }

        /* صندوق الكتابة */
        .chat-input-area { padding: 15px; background-color: #151520; display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; background-color: #252538; border: 1px solid #3d3d5c; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        .chat-input:focus { border-color: #ffd700; }
        .send-btn { padding: 0 25px; background-color: #ffd700; border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { background-color: #e6c200; }

        /* قسم البث المباشر المدمج */
        .stream-panel { width: 350px; background-color: #111118; border-right: 1px solid #2d2d3f; display: flex; flex-direction: column; }
        .stream-header { padding: 15px; text-align: center; font-weight: bold; color: #ff3333; border-bottom: 1px solid #222; }
        .video-container { width: 100%; aspect-ratio: 16/9; background-color: #000; position: relative; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية (الأقسام) -->
    <div class="sidebar">
        <div class="sidebar-header">👑 أقسام الملك</div>
        <div class="rooms-list">
            <button class="room-btn active" onclick="switchRoom('العام')">💬 الدردشة العامة</button>
            <button class="room-btn" onclick="switchRoom('العاب')">🎮 قسم الألعاب</button>
            <button class="room-btn" onclick="switchRoom('الدعم')">🛠️ الشكاوى والدعم</button>
        </div>
    </div>

    <!-- منطقة البث المباشر -->
    <div class="stream-panel">
        <div class="stream-header">🔴 البث المباشر الحالي</div>
        <div class="video-container">
            <!-- ضع آيدي بث اليوتيوب هنا مكان الـ VIDEO_ID ليظهر داخل الموقع -->
            <iframe src="https://www.youtube.com/embed/LIVE_VIDEO_ID_HERE" allowfullscreen></iframe>
        </div>
    </div>

    <!-- منطقة الشات -->
    <div class="chat-area">
        <div class="chat-header">
            <h3 id="current-room-title">💬 الدردشة العامة</h3>
            <span style="color: #aaa; font-size: 14px;">نظام الحماية: <strong style="color: #00ff00;">نشط ✔️</strong></span>
        </div>
        
        <!-- الرسائل -->
        <div class="chat-messages" id="chatMessages">
            <div class="message">
                <div class="msg-meta">
                    <span class="username">البوت الذكي</span>
                    <span class="rank-imperial">🤖 حماية النظام</span>
                </div>
                <div class="msg-text">أهلاً بك يا ملك في شاتك الجديد! نظام الحماية التلقائي ومراقبة الكلمات السيئة يعمل بنجاح.</div>
            </div>
        </div>

        <!-- إرسال الرسالة -->
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="messageInput" placeholder="اكتب رسالتك هنا يا غالي..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        // نظام رتب الـ Karma والإمبراطورية المبدئي
        let currentRoom = "العام";
        const badWords = ["رابط_خبيث", "سب_شتم", "كلمة_ممنوعة"]; // قائمة حظر الكلمات لبوت الحماية

        function switchRoom(roomName) {
            currentRoom = roomName;
            document.getElementById('current-room-title').innerText = 
                roomName === 'العام' ? '💬 الدردشة العامة' : roomName === 'العاب' ? '🎮 قسم الألعاب' : '🛠️ الشكاوى والدعم';
            
            // تغيير تفعيل الأزرار
            document.querySelectorAll('.room-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            if (!text) return;

            // بوت الحماية والتحقق من الكلمات
            let hasBadWord = badWords.some(word => text.includes(word));
            if (hasBadWord) {
                alert("⚠️ تحذير الحماية: تم حجب رسالتك لاحتوائها على كلمات غير مسموح بها!");
                input.value = "";
                return;
            }

            const messagesContainer = document.getElementById('chatMessages');
            
            // إنشاء هيكل الرسالة الجديدة مع رتبة الإمبراطورية
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.style.borderRight = "4px solid #ffd700"; // تمييز رسائل المالك باللون الذهبي

            msgDiv.innerHTML = `
                <div class="msg-meta">
                    <span class="username" style="color: #ffd700;">Hasan</span>
                    <span class="rank-imperial">👑 رتبة إمبراطورية</span>
                </div>
                <div class="msg-text">${text}</div>
            `;

            messagesContainer.appendChild(msgDiv);
            input.value = "";
            messagesContainer.scrollTop = messagesContainer.scrollHeight; // نزول تلقائي لآخر رسالة
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
