<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات الإمبراطورية الاحترافي</title>
    <style>
        :root {
            --bg-main: #0b0c10;
            --bg-chat: #1f2833;
            --bg-side: #151922;
            --gold: #ffd700;
            --super: #ff00bc;
            --admin: #ff3333;
            --mod: #00bcff;
            --member: #00ff66;
            --text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-main); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* الهيدر والأزرار */
        .chat-header {
            background-color: #000000;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            z-index: 10;
        }
        .chat-header h2 { font-size: 16px; color: var(--gold); }
        
        .toggle-btn {
            background: var(--gold);
            border: none; padding: 8px 12px; border-radius: 5px; color: #000;
            font-weight: bold; font-size: 12px; cursor: pointer;
        }

        /* الحاوية الرئيسية */
        .main-container { flex: 1; display: flex; position: relative; overflow: hidden; }

        /* القائمة اليمنى: الرتب */
        .right-sidebar {
            width: 240px; background: var(--bg-side); border-left: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; transition: 0.3s ease; z-index: 8;
        }
        .right-sidebar.hidden { margin-right: -240px; }

        /* القائمة اليسرى: الإضافات */
        .left-sidebar {
            width: 240px; background: var(--bg-side); border-right: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; transition: 0.3s ease; z-index: 8;
        }
        .left-sidebar.hidden { margin-left: -240px; }

        .sidebar-title {
            padding: 12px; background: #000; font-size: 13px; font-weight: bold;
            text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); color: var(--gold);
        }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; }

        /* تصنيفات الرتب */
        .rank-category { margin-bottom: 15px; }
        .category-title { font-size: 11px; color: #888; margin-bottom: 6px; padding-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .user-item { display: flex; align-items: center; gap: 8px; padding: 6px; font-size: 13px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #00ff00; }
        
        .u-super { color: var(--super); font-weight: bold; }
        .u-admin { color: var(--admin); font-weight: bold; }
        .u-mod { color: var(--mod); font-weight: bold; }
        .u-member { color: var(--member); }

        /* أزرار الإضافات */
        .addon-btn {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; text-align: right; font-size: 13px; border-radius: 5px; margin-bottom: 5px; cursor: pointer;
        }
        .addon-btn:hover { border-color: var(--gold); color: var(--gold); }

        /* منطقة الوسط: الشات */
        .center-area { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-chat); position: relative; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message { background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px; max-width: 85%; width: fit-content; border-right: 3px solid var(--gold); }
        .msg-meta { font-size: 11px; margin-bottom: 4px; display: flex; gap: 8px; }
        .msg-text { font-size: 13px; color: #fff; }

        /* صندوق الكتابة */
        .chat-input-area { padding: 10px; background: #000; display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 10px; background: #151922; border: 1px solid rgba(255,255,255,0.1); border-radius: 5px; color: #fff; outline: none; }
        .send-btn { padding: 0 15px; background: var(--gold); border: none; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; top: 0; bottom: 0; height: 100%; }
            .right-sidebar { right: 0; }
            .left-sidebar { left: 0; }
        }
    </style>
</head>
<body>

    <header class="chat-header">
        <button class="toggle-btn" onclick="toggleLeft()">⚙️ الإضافات</button>
        <h2>👑 شات الإمبراطورية 👑</h2>
        <button class="toggle-btn" onclick="toggleRight()">👥 المتواجدون</button>
    </header>

    <div class="main-container">
        <!-- اليسار: الإضافات -->
        <aside class="left-sidebar" id="leftSidebar">
            <div class="sidebar-title">🛠️ لوحة الإضافات</div>
            <div class="sidebar-content">
                <button class="addon-btn">👑 متجر الرتب</button>
                <button class="addon-btn">🎮 قسم الألعاب</button>
                <button class="addon-btn">✏️ زخرفة الأسماء</button>
            </div>
        </aside>

        <!-- الوسط: الشات -->
        <main class="center-area">
            <div class="chat-messages" id="chatMessages">
                <div class="message" style="border-right-color: var(--super);">
                    <div class="msg-meta"><span class="u-super">Hasan [السوبر]</span></div>
                    <div class="msg-text">مرحباً بكم في الشات الرسمي.</div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </main>

        <!-- اليمين: الرتب -->
        <aside class="right-sidebar" id="rightSidebar">
            <div class="sidebar-title">👥 المتواجدون</div>
            <div class="sidebar-content">
                <div class="rank-category">
                    <div class="category-title">👑 السوبر</div>
                    <div class="user-item"><span class="status-dot"></span><span class="u-super">Hasan</span></div>
                </div>
                <div class="rank-category">
                    <div class="category-title">🔴 الأدمن</div>
                    <div class="user-item"><span class="status-dot"></span><span class="u-admin">Hussam_Admin</span></div>
                </div>
                <div class="rank-category">
                    <div class="category-title">🔵 المشرفين</div>
                    <div class="user-item"><span class="status-dot"></span><span class="u-mod">علاوي_المشرف</span></div>
                </div>
                <div class="rank-category">
                    <div class="category-title">🟢 الأعضاء</div>
                    <div class="user-item"><span class="status-dot"></span><span class="u-member">ابن_بغداد</span></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        function toggleLeft() { document.getElementById('leftSidebar').classList.toggle('hidden'); }
        function toggleRight() { document.getElementById('rightSidebar').classList.toggle('hidden'); }
        function sendMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            if (!text) return;
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.innerHTML = `<div class="msg-meta"><span class="u-super">Hasan</span></div><div class="msg-text">${text}</div>`;
            document.getElementById('chatMessages').appendChild(msgDiv);
            input.value = "";
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }
        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
